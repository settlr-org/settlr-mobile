appId: com.settlr.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Good to see you|Create your account"
    timeout: 15000
- takeScreenshot: 00-heavy-launch
- tapOn:
    id: "auth-email"
    point: "99%,50%"
- eraseText: 100
- inputText: "heavy@test.local"
- tapOn:
    id: "auth-password"
    point: "99%,50%"
- eraseText: 100
- inputText: "Test123!Test123!"
- takeScreenshot: 01-heavy-login-filled
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 15000
- takeScreenshot: 02-heavy-overview
- assertVisible: "NET BALANCE"
- takeScreenshot: 03-heavy-overview-card
# Groups
- tapOn:
    id: "tab-groups"
- extendedWaitUntil:
    visible: "Your groups"
    timeout: 10000
- takeScreenshot: 10-heavy-groups-list
# Group detail - first group
- tapOn: "Family Home"
- extendedWaitUntil:
    visible: "SHARED LEDGER"
    timeout: 10000
- takeScreenshot: 11-heavy-group-detail
- tapOn:
    id: "group-tab-balances"
- takeScreenshot: 12-heavy-balances
- tapOn:
    id: "group-tab-settlements"
- takeScreenshot: 13-heavy-settlements
- tapOn:
    id: "group-tab-members"
- takeScreenshot: 14-heavy-members
- tapOn:
    id: "group-tab-expenses"
- takeScreenshot: 15-heavy-expenses-list
- pressKey: Back
# Add expense
- tapOn:
    id: "fab-add"
- extendedWaitUntil:
    visible: "Where does this belong.*"
    timeout: 5000
- takeScreenshot: 20-heavy-add-chooser
- tapOn: "Shared expense"
- extendedWaitUntil:
    visible: "Add an expense"
    timeout: 10000
- takeScreenshot: 21-heavy-add-form
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- takeScreenshot: 22-heavy-add-form-scrolled
- pressKey: Back
- pressKey: Back
# Personal
- tapOn:
    id: "tab-personal"
- extendedWaitUntil:
    visible: "Personal"
    timeout: 10000
- takeScreenshot: 30-heavy-personal
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- takeScreenshot: 31-heavy-personal-scrolled
# More hub
- tapOn:
    id: "tab-more"
- extendedWaitUntil:
    visible: "Everything else.*"
    timeout: 5000
- takeScreenshot: 40-heavy-more
# Friends
- tapOn:
    id: "more-friends"
- extendedWaitUntil:
    visible: "Find people"
    timeout: 5000
- takeScreenshot: 41-heavy-friends
- tapOn:
    id: "tab-more"
# Activity
- tapOn:
    id: "more-activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 10000
- takeScreenshot: 42-heavy-activity
- tapOn:
    id: "tab-more"
# Search
- tapOn:
    id: "more-search"
- extendedWaitUntil:
    visible: "Search"
    timeout: 5000
- takeScreenshot: 43-heavy-search
- pressKey: Back
# Notifications
- tapOn:
    id: "more-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 5000
- takeScreenshot: 44-heavy-notifications
- pressKey: Back
# Settings
- tapOn:
    id: "more-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
- takeScreenshot: 45-heavy-settings
- pressKey: Back
- tapOn:
    id: "tab-home"
- takeScreenshot: 46-heavy-final-home
