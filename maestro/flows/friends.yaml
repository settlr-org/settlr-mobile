appId: com.settlr.app
---
# Friends — search, invite, requests
- runFlow: login.yaml
- launchApp:
    clearState: false
- tapOn: "Friends"
- assertVisible: "Friends"
- assertVisible: "Find people"
- tapOn:
    id: "friends-search-input"
- inputText: "Maestro"
- tapOn:
    id: "friends-search-submit"
- extendedWaitUntil:
    visible: ".*@.*"
    timeout: 5000
    optional: true
- tapOn: "Invite by email"
- tapOn:
    id: "friends-invite-email"
- inputText: "maestro-friend+${MAESTRO_RUN_ID}@test.local"
- hideKeyboard
- tapOn:
    id: "friends-invite-submit"
- assertVisible: "Invitation sent.*"
