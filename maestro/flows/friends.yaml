appId: com.settlr.app
---
# Friends — search, invite, requests
- launchApp:
    clearState: false
# Wait for the signed-in shell, then use the actual More-hub navigation.
# The dashboard itself has a "Friends" heading, so tapping that text is not
# a reliable navigation action.
- extendedWaitUntil:
    visible: "Overview"
    timeout: 10000
- tapOn: "More"
- extendedWaitUntil:
    visible: "Everything else in your Settlr workspace."
    timeout: 5000
- tapOn: "Friends"
- extendedWaitUntil:
    visible: "Find people"
    timeout: 5000
- tapOn:
    id: "friends-search-input"
- inputText: "Maestro"
- tapOn:
    id: "friends-search-submit"
- extendedWaitUntil:
    visible: ".*@.*"
    timeout: 5000
    optional: true
- scrollUntilVisible:
    element:
      id: "friends-invite-email"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "friends-invite-email"
- inputText: "maestro-friend+${MAESTRO_RUN_ID}@test.local"
- hideKeyboard
- tapOn:
    id: "friends-invite-submit"
- assertVisible: "Invitation sent.*"
