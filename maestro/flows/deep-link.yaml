appId: com.settlr.app
---
# Deep links — settlr:// scheme
- runFlow: login.yaml
- launchApp:
    clearState: false
# `launchApp` restarts Android even with persisted state. Wait for SecureStore
# restoration and Expo Router hydration before handing it an intent.
- extendedWaitUntil:
    visible: "Overview"
    timeout: 10000
- openLink: "settlr://groups"
- extendedWaitUntil:
    visible: "Your groups"
    timeout: 10000
- openLink: "settlr://activity"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 10000
