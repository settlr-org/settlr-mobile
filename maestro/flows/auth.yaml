appId: com.settlr.app
---
# Auth — registration must not create a session until the email is verified.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create account"
    timeout: 15000
- tapOn: "Create account"
- assertVisible: "Create a free account"
- tapOn: "Name"
- inputText: "Maestro Tester"
- tapOn: "Email"
- inputText: "maestro+${MAESTRO_RUN_ID}@test.local"
- tapOn: "Password"
- inputText: "Test123!Test123!"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 10000
- assertVisible: "Back to login"
- tapOn: "Back to login"
- assertVisible: "Good to see you"
- tapOn: "Email"
- inputText: "maestro+${MAESTRO_RUN_ID}@test.local"
- tapOn: "Password"
- inputText: "Test123!Test123!"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 10000
- assertVisible: "Home"
