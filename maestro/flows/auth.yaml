appId: com.settlr.app
---
# Auth — registration must not create a session until the email is verified.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "New to Settlr\\? Create an account"
    timeout: 15000
- tapOn:
    id: "auth-mode-switch"
- assertVisible: "Create your account"
- tapOn:
    id: "register-name"
- inputText: "Maestro Tester"
- tapOn:
    id: "auth-email"
- inputText: "m${MAESTRO_RUN_ID}@test.local"
- pressKey: Enter
- inputText: "Test123!Test123!"
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 10000
- assertVisible: "Back to login"
- tapOn:
    id: "auth-back-to-login"
- assertVisible: "Good to see you"
