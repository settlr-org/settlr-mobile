appId: com.settlr.app
---
# A verified fixture is provisioned by scripts/test-platform.sh.
- launchApp:
    clearState: true
- tapOn:
    id: "auth-email"
- inputText: "${MAESTRO_EMAIL}"
- tapOn:
    id: "auth-password"
- inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 15000
- assertVisible: "Home"
