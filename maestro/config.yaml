# Maestro config for Settlr mobile
# See https://maestro.mobile.dev

# Default env — local emulator talks to host via 10.0.2.2
# For staging: maestro test --env STAGING=1 or set EXPO_PUBLIC_API_URL
env:
  STAGING: "0"
  API_URL: "http://10.0.2.2:18081"

# On CI, emulator is fresh, so no need to clear state between flows
flowsOrder:
  - auth.yaml
  - login.yaml
  - empty-shared-expense.yaml
  - groups.yaml
  - expense-equal.yaml
  - keyboard-safe-forms.yaml
  - personal.yaml
  - friends.yaml
  - deep-link.yaml
  - full-coverage.yaml

# Screenshots — stored via takeScreenshot (maestro 1.35+)
screenshots:
  outputDir: ./maestro/screenshots
